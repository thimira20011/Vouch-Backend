name: Vouch Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Vouch.slnx

    - name: Build
      run: dotnet build Vouch.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/Vouch.UnitTests/Vouch.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Configure isolated PostgreSQL tests
      shell: bash
      run: |
        test_password=$(openssl rand -hex 24)
        echo "::add-mask::$test_password"
        echo "VOUCH_TEST_POSTGRES_PASSWORD=$test_password" >> "$GITHUB_ENV"
        echo "VOUCH_TEST_POSTGRES_ADMIN=Host=127.0.0.1;Port=55432;Database=vouch_test_admin;Username=vouch_test_runner;Password=$test_password" >> "$GITHUB_ENV"

    - name: Start isolated PostgreSQL
      run: docker compose -p vouch-ci-tests -f docker-compose.test.yml up -d --wait

    - name: Run API and PostgreSQL Integration Tests
      run: dotnet test tests/Vouch.IntegrationTests/Vouch.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

    - name: Stop isolated PostgreSQL
      if: always()
      run: docker compose -p vouch-ci-tests -f docker-compose.test.yml down

    - name: Test Photo Processing on Alpine
      run: docker build --target photo-tests -t vouch-photo-tests:latest .

    - name: Build Docker Image
      run: docker build -t vouch-backend:latest .
