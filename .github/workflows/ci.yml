name: Vouch Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Vouch.slnx

    - name: Build
      run: dotnet build Vouch.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/Vouch.UnitTests/Vouch.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Build Docker Image
      run: docker build -t vouch-backend:latest .
