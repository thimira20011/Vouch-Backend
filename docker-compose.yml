services:
  postgres:
    image: postgres:17-alpine
    container_name: vouch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vouch_db}
      POSTGRES_USER: ${POSTGRES_USER:-vouch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vouch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vouch_db};Username=${POSTGRES_USER:-vouch};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      Jwt__Issuer: ${Jwt__Issuer:-VouchBackend}
      Jwt__Audience: ${Jwt__Audience:-VouchFrontend}
      Security__EncryptionKey: ${Security__EncryptionKey:?Set Security__EncryptionKey in .env}
      Security__EmailLookupKey: ${Security__EmailLookupKey:?Set an independent Security__EmailLookupKey in .env}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-http://localhost:3000}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__User: ${Smtp__User:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__FromAddress: ${Smtp__FromAddress:-}
      Smtp__ArchitectEmail: ${Smtp__ArchitectEmail:-}
      PhotoStorage__BasePath: /app/wwwroot/photos
      PhotoStorage__BaseUrl: ${PhotoStorage__BaseUrl:-/photos}
      Anthropic__ApiKey: ${Anthropic__ApiKey:-}
      BackgroundJobs__Enabled: ${BackgroundJobs__Enabled:-true}
    ports:
      - "5000:8080"
    volumes:
      - photo_data:/app/wwwroot/photos

volumes:
  postgres_data:
  photo_data:
